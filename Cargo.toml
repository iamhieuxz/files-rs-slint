[workspace]
resolver = "2"
members = [
    "crates/files-core",
    "crates/files-fs",
    "app",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
files-core = { path = "crates/files-core" }
files-fs = { path = "crates/files-fs" }
slint = { version = "1.19", default-features = true, features = ["image-default-formats", "unstable-winit-030"] }
slint-build = "1.19"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
