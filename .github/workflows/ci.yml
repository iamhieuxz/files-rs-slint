name: CI

# Ba thứ phải xanh trước khi merge: build, test, clippy. Không thêm bước nào
# không kiểm chứng được điều gì — CI chậm là CI bị bỏ qua.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Cảnh báo của rustc là lỗi: đã giữ 0 cảnh báo suốt quá trình phát triển,
  # và bước này giữ cho nó như vậy.
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (build, test, clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache của cargo: build Slint khá nặng, cache giúp vòng lặp phản hồi ngắn.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Khoảng trắng thừa và dòng trống cuối tệp không làm hỏng build nhưng tạo
      # nhiễu trong diff. `git diff --check` trên checkout sạch luôn rỗng, nên
      # quét trực tiếp các tệp văn bản đã track. Tệp nhị phân (png, ico) bị bỏ
      # qua: chúng không có khái niệm khoảng trắng cuối dòng.
      - name: Diff hygiene
        shell: pwsh
        run: |
          $binary = @('.png', '.ico', '.jpg', '.jpeg', '.gif', '.webp', '.zip', '.exe', '.dll')
          $bad = @()
          foreach ($f in (git ls-files)) {
            if ($binary -contains [System.IO.Path]::GetExtension($f).ToLowerInvariant()) { continue }
            $text = Get-Content -LiteralPath $f -Raw -ErrorAction SilentlyContinue
            if ($null -eq $text) { continue }
            if ($text -match '[ \t]+\r?\n') { $bad += "$f (trailing whitespace)" }
            if ($text -match '(\r?\n){2,}$') { $bad += "$f (blank line at EOF)" }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "No trailing whitespace or blank line at EOF."

      - name: Build (debug)
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # Cảnh báo (không fail) khi module vượt ~800 dòng, để biết lúc nào nên
      # tách file thay vì để một module phình dần.
      - name: Kích thước module
        shell: pwsh
        run: ./scripts/check-module-size.ps1

      # Bản release là thứ người dùng thật chạy; build nó ở đây để lỗi chỉ xuất
      # hiện khi tối ưu hoá bị bắt trước khi phát hành.
      - name: Build (release)
        run: cargo build --workspace --release
