[package]
name = "files-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Filesystem access for a Windows file manager: listing, drives, watching."

[dependencies]
serde = { workspace = true }
files-core = { workspace = true }
notify = "8"
sysinfo = "0.37"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
