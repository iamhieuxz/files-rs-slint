[package]
name = "files-rs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Slint desktop shell for the Rust file manager."

[[bin]]
name = "files-rs"
path = "src/main.rs"

[dependencies]
slint = { workspace = true }
files-core = { workspace = true }
files-fs = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
